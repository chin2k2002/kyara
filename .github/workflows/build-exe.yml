name: build-exe
on:
  push:
    branches: [claude/nice-dirac-e92c1y, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pywin32 pyinstaller pytest
      - run: python -m pytest -q
      - run: >
          python -m PyInstaller --noconfirm --onefile --name kyara
          --hidden-import win32timezone --hidden-import pythoncom
          --hidden-import win32api --collect-submodules win32com
          run_kyara.py
      - name: Smoke test (起動して設定なしで終了できること)
        shell: pwsh
        run: |
          $p = Start-Process dist\kyara.exe -PassThru
          Start-Sleep 5
          if ($p.HasExited) { throw "kyara.exe が起動直後に終了しました" }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: kyara-exe
          path: dist/kyara.exe
