name: build-exe
on:
  push:
    branches: [claude/nice-dirac-e92c1y, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pywin32 pystray pillow opencv-python pymupdf pyinstaller pytest
      - run: python -m pytest -q
      - run: >
          python -m PyInstaller --noconfirm --onefile --noconsole --name kyara
          --hidden-import win32timezone --hidden-import pythoncom
          --hidden-import win32api --hidden-import pystray._win32
          --collect-all pymupdf
          --collect-submodules win32com
          run_kyara.py
      - name: Self test (exe に OpenCV / PyMuPDF が同梱されていること)
        shell: pwsh
        run: |
          $p = Start-Process dist\kyara.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\kyara_selftest.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "selftest 失敗 (exit $($p.ExitCode))" }
      - name: Smoke test (GUI 付きで起動し、5 秒間落ちないこと)
        shell: pwsh
        run: |
          $env:APPDATA = "$PWD\smoke_appdata"
          $p = Start-Process dist\kyara.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep 6
          if ($p.HasExited) {
            Get-Content "$env:APPDATA\kyara\kyara.log" -ErrorAction SilentlyContinue
            throw "kyara.exe が起動直後に終了しました"
          }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        with:
          name: kyara-exe
          path: dist/kyara.exe
